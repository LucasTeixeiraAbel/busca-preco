services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar-dev-password
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://radar:radar-dev-password@postgres:5432/radar
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: http://localhost:3000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  scraper:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.scraper"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://radar:radar-dev-password@postgres:5432/radar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.scheduler"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://radar:radar-dev-password@postgres:5432/radar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  notifier:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.notify"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://radar:radar-dev-password@postgres:5432/radar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  telegram-bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.telegram_bot"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://radar:radar-dev-password@postgres:5432/radar
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["telegram"]
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    environment:
      BACKEND_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
